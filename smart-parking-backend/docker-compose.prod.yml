services:
  mqtt-init:
    image: eclipse-mosquitto:2
    user: "0:0"
    env_file:
      - ${ENV_FILE:-.env.production}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rm -f /mosquitto/data/password_file
        && mosquitto_passwd -b -c /mosquitto/data/password_file
        "$${MQTT_USERNAME}" "$${MQTT_PASSWORD}"
        && chown 1883:1883 /mosquitto/data/password_file
        && chmod 0700 /mosquitto/data/password_file
    volumes:
      - mqtt-data:/mosquitto/data
    restart: "no"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: smart-parking-mqtt
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h 127.0.0.1
          -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}"
          -t '$$SYS/broker/version' -C 1 -W 3
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-parking-backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      MQTT_BROKER_URL: mqtt://mqtt:1883
      ANPR_STORAGE_DIR: /app/storage/anpr
    depends_on:
      mqtt:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - anpr-images:/app/storage/anpr
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then(r => { if (!r.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  https:
    image: caddy:2-alpine
    container_name: smart-parking-https
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mqtt-data:
  anpr-images:
  caddy-data:
  caddy-config:
