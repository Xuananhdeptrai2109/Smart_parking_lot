name: smart-parking-local

services:
  db:
    image: mysql:8.0
    container_name: smart-parking-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smart_parking_root}
      MYSQL_DATABASE: smart_parking
      MYSQL_USER: smart_parking
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smart_parking_local}
      TZ: Asia/Bangkok
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/smart_parking_init.sql:/docker-entrypoint-initdb.d/01-smart-parking.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1 -u root
          -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mqtt:
    image: eclipse-mosquitto:2
    container_name: smart-parking-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-parking-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://smart_parking:${MYSQL_PASSWORD:-smart_parking_local}@db:3306/smart_parking
      PRISMA_TRANSACTION_MAX_WAIT_MS: 10000
      PRISMA_TRANSACTION_TIMEOUT_MS: 20000
      MQTT_BROKER_URL: mqtt://mqtt:1883
      MQTT_CLIENT_ID: smart-parking-backend-local
      MQTT_TOPIC_PREFIX: smart-parking
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ANPR_STORAGE_DIR: /app/storage/anpr
      CAMERA_DEVICE_CODE: CAMERA_MAIN
      ANPR_DEVICE_KEY: ${ANPR_DEVICE_KEY:-local-camera-device-key}
      PLATE_RECOGNIZER_TOKEN: ${PLATE_RECOGNIZER_TOKEN:-}
      ANPR_REGION: ${ANPR_REGION:-vn}
      ANPR_MIN_SCORE: ${ANPR_MIN_SCORE:-0.55}
      ANPR_TIMEOUT_MS: ${ANPR_TIMEOUT_MS:-20000}
      FIRE_FLAME_THRESHOLD: ${FIRE_FLAME_THRESHOLD:-0.65}
      FIRE_GAS_THRESHOLD: ${FIRE_GAS_THRESHOLD:-0.90}
      PARKING_PRICE_FIRST_2_HOURS: ${PARKING_PRICE_FIRST_2_HOURS:-10000}
      PARKING_PRICE_UP_TO_5_HOURS: ${PARKING_PRICE_UP_TO_5_HOURS:-20000}
      PARKING_PRICE_EXTRA_HOUR: ${PARKING_PRICE_EXTRA_HOUR:-5000}
      PARKING_QR_EXPIRES_MINUTES: ${PARKING_QR_EXPIRES_MINUTES:-5}
    ports:
      - "3000:3000"
    volumes:
      - anpr-images:/app/storage/anpr
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then(r => { if (!r.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend-build:
    image: node:22-alpine
    container_name: smart-parking-frontend-build
    working_dir: /src
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    volumes:
      - ../smart-parking-frontend:/src
      - frontend-node-modules:/src/node_modules
      - frontend-dist:/output
    command:
      - /bin/sh
      - -c
      - >-
        npm ci
        && npm run build
        && rm -rf /output/*
        && cp -R dist/. /output/
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  frontend:
    image: nginx:1.27-alpine
    container_name: smart-parking-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  mqtt-data:
  anpr-images:
  frontend-node-modules:
  frontend-dist:
