services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: smart-parking-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data

volumes:
  mqtt-data:
